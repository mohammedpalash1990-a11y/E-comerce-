name: Canonical Storefront Playwright
on:
  push:
  pull_request:
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run canonical storefront browser tests
        run: npx playwright test
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-storefront-playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
