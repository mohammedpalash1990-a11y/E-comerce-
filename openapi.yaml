openapi: 3.0.3
info:
  title: HAAT Marketplace API
  version: 1.0.0
  description: Development API contract for the Bangladesh multi-vendor marketplace MVP.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: API health
      responses:
        '200': { description: Service is healthy }
  /api/v1/categories:
    get:
      summary: List active categories
      responses:
        '200': { description: Category list }
  /api/v1/products:
    get:
      summary: Search and filter publicly visible products
      description: >-
        Public PostgreSQL catalog endpoint. Only active products belonging to
        approved sellers are returned. Price filters are BDT values converted
        to integer paisa by the server. Sort is allowlisted; malformed numeric
        filters are ignored. Pagination is capped at 100 items and offset 10000.
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 80 }
        - in: query
          name: category
          schema: { type: string, maxLength: 100 }
        - in: query
          name: brand
          schema: { type: string, maxLength: 100 }
        - in: query
          name: min_price
          description: Minimum effective selling price in BDT; zero is allowed.
          schema: { type: number, minimum: 0 }
        - in: query
          name: max_price
          description: Maximum effective selling price in BDT; must be greater than zero.
          schema: { type: number, minimum: 0, exclusiveMinimum: true }
        - in: query
          name: sort
          schema: { type: string, enum: [price_asc, price_desc, newest] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: Public product list with integer-paisa and BDT price fields.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogProductListItem' }
  /api/v1/brands:
    get:
      summary: List public brands
      description: Returns the public brand slug and display name, ordered by name.
      responses:
        '200':
          description: Public brand list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Brand' }
  /api/v1/products/suggest:
    get:
      summary: Suggest public products for search autocomplete
      description: Returns at most eight active products from approved sellers; query is truncated to 40 characters and empty queries return an empty list.
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Search suggestions with product ID and bilingual names.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogSuggestion' }
  /api/v1/products/{id}:
    get:
      summary: Read public product details
      description: Returns only active products from approved sellers and excludes seller ownership IDs and credential fields.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Public product detail with rating aggregate and images.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CatalogProductDetail' }
        '404': { description: Product is missing, inactive or not sold by an approved seller }
  /api/v1/products/{id}/reviews:
    get:
      summary: List public reviews for a product
      description: Returns at most 50 newest reviews without reviewer account IDs.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Public product reviews.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductReview' }
  /api/v1/auth/login:
    post:
      summary: Customer, seller or admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Authenticated session }
        '401': { description: Invalid credentials }
  /api/v1/checkout:
    post:
      summary: Place COD order
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Order created }
        '401': { description: Authentication required }
  /api/v1/customer/orders/{id}:
    get:
      summary: Read an owned order with items and seller sub-orders
      description: >-
        PostgreSQL development endpoint. Returns a repeatable-read snapshot.
        Missing and foreign orders both return 404. Private admin notes, seller
        earnings and payment-provider payloads are never included.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Customer order detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CustomerOrder' }
        '400': { description: Invalid URL encoding }
        '401': { description: "Missing, invalid, revoked or expired session" }
        '403': { description: Authenticated user is not a customer }
        '404': { description: Order not found or not owned by this customer }
        '405': { description: Unsupported method; Allow header contains GET }
  /api/v1/customer/orders/{id}/tracking:
    get:
      summary: Read an owned order timeline and recorded shipments
      description: >-
        PostgreSQL development endpoint. Events and shipments are ordered by
        creation time then ID. This reads stored records; it does not poll a
        courier or invent tracking events. Operational free-text event notes and
        actor IDs are omitted. Shipment mode distinguishes sandbox records.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Customer tracking snapshot
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CustomerTracking' }
        '400': { description: Invalid URL encoding }
        '401': { description: "Missing, invalid, revoked or expired session" }
        '403': { description: Authenticated user is not a customer }
        '404': { description: Order not found or not owned by this customer }
        '405': { description: Unsupported method; Allow header contains GET }
  /api/v1/customer/cart:
    get:
      summary: Read the signed-in customer's saved cart
      description: >-
        PostgreSQL development endpoint. Prices are current catalog estimates;
        no inventory is reserved. Saved inactive or unavailable products remain
        visible with available=false so the customer can remove them. The subtotal
        includes all stored lines and is not a checkout quote.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '401': { description: Active customer session required }
        '403': { description: Authenticated role is not CUSTOMER }
    put:
      summary: Replace a cart line quantity; zero removes the line
      description: >-
        Sets the absolute quantity; it is not additive. Accepts integer numbers
        or digit-only form strings. Rejects null and boolean quantities rather
        than interpreting them as removal. New positive quantities require a live
        product from an approved seller and sufficient current stock. At most
        50 distinct products and 1000 units per product. Ownership comes only
        from the session; client-supplied prices and user IDs are ignored.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string, minLength: 1, maxLength: 160 }
                quantity:
                  oneOf:
                    - type: integer
                      minimum: 0
                      maximum: 1000
                    - type: string
                      pattern: '^\s*[0-9]+\s*$'
                      description: Numeric value must be between 0 and 1000.
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '400': { description: Invalid product ID or quantity }
        '401': { description: Active customer session required }
        '403': { description: Authenticated role is not CUSTOMER }
        '404': { description: Product is missing or unavailable for a positive quantity }
        '409': { description: Insufficient stock or distinct-product limit reached }
    delete:
      summary: Clear only the signed-in customer's saved cart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '401': { description: Active customer session required }
        '403': { description: Authenticated role is not CUSTOMER }
  /api/v1/customer/cart/{pid}:
    delete:
      summary: Remove one cart line even if the product is no longer available
      description: Idempotent; removing an absent line succeeds without changing other carts.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: pid
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/CartResponse' }
        '400': { description: Invalid product ID or URL encoding }
        '401': { description: Active customer session required }
        '403': { description: Authenticated role is not CUSTOMER }
  /api/v1/coupons/validate:
    post:
      summary: Preview a coupon against the authenticated customer's saved cart
      description: >-
        PostgreSQL development endpoint. Normalize the code and calculate the
        subtotal from current server-side cart prices. Client subtotal_bdt and
        discount_bdt fields are ignored. Empty or unavailable carts are rejected.
        This read-only preview neither reserves nor consumes coupon uses.
        Checkout must revalidate eligibility and consume usage atomically with
        the order. Preview is not a shipping quote or a final payable total.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 1 to 30 ASCII letters/digits/underscores/hyphens after trimming; case insensitive.
                  example: SAVE20
      responses:
        '200':
          description: Current coupon preview; eligibility can change before checkout.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [code, discount_bdt, subtotal_bdt]
                    properties:
                      code: { type: string }
                      discount_bdt: { type: number, description: Discount on item subtotal only; not shipping. }
                      subtotal_bdt: { type: number, description: Server-calculated saved-cart subtotal before coupon discount. }
        '400': { description: Missing or invalid code; empty cart; coupon unavailable or minimum order not met. }
        '401': { description: Active customer session required }
        '403': { description: Authenticated role is not CUSTOMER }
        '409': { description: Cart contains unavailable items or exceeds checkout limits }
        '405': { description: Unsupported method; Allow header contains POST }
  /api/v1/admin/coupons:
    get:
      summary: List configured coupons for administrators
      description: >-
        PostgreSQL development endpoint. Ordered by code with bounded pagination.
        active is the stored switch, not a guarantee of redemption eligibility.
        Retains legacy value units; use value_bdt for FIXED display values.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 300, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - in: query
          name: active
          schema: { type: integer, enum: [0, 1] }
      responses:
        '200':
          description: Coupon array; numeric active and stored-unit value retain the existing contract.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCoupon' }
        '400': { description: Invalid or repeated pagination/filter parameters }
        '401': { description: Active session required }
        '403': { description: ADMIN role required }
    post:
      summary: Create a coupon with an atomic audit record
      description: >-
        No coupon values are seeded. FIXED value input is BDT with at most two
        decimal places; PERCENT is a whole percentage from 1 to 90. Unknown fields
        are rejected and used_count always starts at zero. Expiry must be in the
        future at transaction time. A duplicate normalized code returns 409;
        existing terms are never overwritten.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCouponCreate' }
      responses:
        '201':
          description: Created and audited coupon.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code: { type: string }
        '400': { description: Invalid input or expiry; unknown fields are not accepted }
        '401': { description: Active session required }
        '403': { description: Active ADMIN required }
        '409': { description: Coupon code already exists }
        '500': { description: Persistence or audit failure; the transaction is rolled back }
  /api/v1/admin/coupons/{code}:
    patch:
      summary: Activate or deactivate a coupon with an atomic transition audit
      description: >-
        Accepts only a JSON boolean active. It cannot reset usage or alter economic
        terms. Same-state requests make no new audit record. Enabling expired,
        exhausted or invalid coupons returns 409. The coupon row is locked using
        the same lock as checkout, so deactivation preserves prior redemptions
        and does not retroactively cancel an order that commits first.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: Updated or already matching switch.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code: { type: string }
                      active: { type: boolean }
        '400': { description: Invalid code/encoding or unsupported body fields }
        '401': { description: Active session required }
        '403': { description: Active ADMIN required }
        '404': { description: Coupon not found }
        '409': { description: Coupon cannot be enabled in its current state }
        '500': { description: Persistence or audit failure; the transaction is rolled back }
  /api/v1/customer/addresses:
    get:
      summary: List the authenticated customer's saved delivery addresses
      description: Ordered with the default address first. Addresses belong only to the calling customer.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Saved addresses, with is_default as an integer flag (0 or 1).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
        '401':
          description: Active CUSTOMER session required.
        '403':
          description: Non-customer role.
    post:
      summary: Save a delivery address
      description: >-
        The first saved address becomes the default automatically. A customer may
        store at most 10 addresses; concurrent creation is serialized and the
        eleventh returns 400. A true is_default clears any previous default.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Saved address identifier.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
        '400':
          description: Invalid phone/name/address/area/label, invalid is_default type, or the ten-address limit.
        '401':
          description: Active CUSTOMER session required.
        '403':
          description: Non-customer role.
  /api/v1/customer/addresses/{id}:
    put:
      summary: Replace the editable fields of one saved address
      description: >-
        Ownership is enforced by the session. Setting is_default true clears the
        other defaults; setting it false promotes another saved address so exactly
        one default remains. Another customer's address id returns 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Address updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
        '400':
          description: Invalid address fields.
        '401':
          description: Active CUSTOMER session required.
        '403':
          description: Non-customer role.
        '404':
          description: Address not found for this customer.
    delete:
      summary: Delete one saved address
      description: Deleting the default address promotes a remaining address. Missing or foreign ids are an idempotent success and delete nothing.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deletion acknowledged (or nothing to delete).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted: { type: boolean }
        '401':
          description: Active CUSTOMER session required.
        '403':
          description: Non-customer role.
  /api/v1/customer/wishlist:
    get:
      summary: List the authenticated customer's wishlist
      description: Only products that are active, ACTIVE-status and owned by an APPROVED seller are returned.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Wishlist products with the public product view fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WishlistProduct' }
        '401':
          description: Active CUSTOMER session required.
        '403':
          description: Non-customer role.
    post:
      summary: Add a product to the wishlist
      description: Idempotent; adding the same product twice keeps a single row and does not reorder the list.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Product present in the wishlist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      added: { type: boolean }
        '400':
          description: Missing, non-string or over-long product identifier.
        '401':
          description: Active CUSTOMER session required.
        '403':
          description: Non-customer role.
        '404':
          description: Product is unknown, inactive or not sold by an approved seller.
  /api/v1/customer/wishlist/{productId}:
    delete:
      summary: Remove a product from the wishlist
      description: Idempotent and scoped to the calling customer; other customers' wishlists are unaffected.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removal acknowledged (or nothing to remove).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      removed: { type: boolean }
        '400':
          description: Invalid product identifier or URL encoding.
        '401':
          description: Active CUSTOMER session required.
        '403':
          description: Non-customer role.
  /api/v1/customer/products/{id}/reviews:
    post:
      summary: Create or update the customer's review for a delivered product
      description: >-
        Requires a DELIVERED seller order containing the product for the calling
        customer; a confirmed but undelivered order is rejected with 403. Ratings
        are integers 1-5 (numeric strings are accepted, booleans and arrays are
        not) and comments are optional up to 1000 characters. Each customer has
        one review per product, so repeat submissions update the existing rating
        and comment in place. The public review list and product aggregate update
        immediately.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  description: Whole star rating from 1 to 5. Booleans and non-digit strings are rejected.
                  oneOf:
                    - type: integer
                      minimum: 1
                      maximum: 5
                    - type: string
                      pattern: '^[1-5]$'
                comment: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Review saved (created or updated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      saved: { type: boolean }
        '400':
          description: Invalid rating, comment or product identifier.
        '401':
          description: Active CUSTOMER session required.
        '403':
          description: Non-customer role, or no delivered purchase of this product.

  /api/v1/seller/profile:
    get:
      summary: Read the authenticated seller profile
      description: >-
        PostgreSQL route restricted to an authenticated SELLER account. Response fields reflect the mounted handler.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items: { type: object, additionalProperties: true }
        '400': { description: Invalid request parameters or body }
        '401': { description: Missing, invalid, revoked or expired session }
        '403': { description: Authenticated account does not have the required role or ownership }
        '404': { description: Requested resource was not found }
        '409': { description: Operation conflicts with the current resource state }
  /api/v1/seller/dashboard:
    get:
      summary: Read seller dashboard metrics and recent orders
      description: >-
        PostgreSQL route restricted to an authenticated SELLER account. Response fields reflect the mounted handler.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items: { type: object, additionalProperties: true }
        '400': { description: Invalid request parameters or body }
        '401': { description: Missing, invalid, revoked or expired session }
        '403': { description: Authenticated account does not have the required role or ownership }
        '404': { description: Requested resource was not found }
        '409': { description: Operation conflicts with the current resource state }
  /api/v1/seller/orders:
    get:
      summary: List the authenticated seller's orders
      description: >-
        PostgreSQL route restricted to an authenticated SELLER account. Response fields reflect the mounted handler.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items: { type: object, additionalProperties: true }
        '400': { description: Invalid request parameters or body }
        '401': { description: Missing, invalid, revoked or expired session }
        '403': { description: Authenticated account does not have the required role or ownership }
        '404': { description: Requested resource was not found }
        '409': { description: Operation conflicts with the current resource state }
  /api/v1/seller/orders/{id}:
    get:
      summary: Read a seller-owned order and its items
      description: >-
        PostgreSQL route restricted to an authenticated SELLER account. Response fields reflect the mounted handler.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items: { type: object, additionalProperties: true }
        '400': { description: Invalid request parameters or body }
        '401': { description: Missing, invalid, revoked or expired session }
        '403': { description: Authenticated account does not have the required role or ownership }
        '404': { description: Requested resource was not found }
        '409': { description: Operation conflicts with the current resource state }
  /api/v1/seller/orders/{id}/status:
    post:
      summary: Update the status of a seller-owned order
      description: >-
        PostgreSQL route restricted to an authenticated SELLER account. Response fields reflect the mounted handler.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - type: object
                        additionalProperties: true
                      - type: array
                        items: { type: object, additionalProperties: true }
        '400': { description: Invalid request parameters or body }
        '401': { description: Missing, invalid, revoked or expired session }
