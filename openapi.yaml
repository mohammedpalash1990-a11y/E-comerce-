components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProductId:
      in: path
      name: id
      required: true
      description: Internal product identifier.
      schema: { type: string, minLength: 1, maxLength: 160 }
    OrderId:
      in: path
      name: id
      required: true
      description: Internal order ID, not the shortened display order number.
      schema: { type: string }
  responses:
    CartResponse:
      description: Current customer cart; no stock reservation or final checkout price guarantee.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/CustomerCart' }
  schemas:
    Brand:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    CatalogSuggestion:
      type: object
      required: [id, name_bn, name_en]
      properties:
        id: { type: string }
        name_bn: { type: string }
        name_en: { type: string }
    CatalogProductListItem:
      type: object
      required: [id, name_bn, name_en, price_paisa, discount_paisa, stock, price_bdt, sale_price_bdt, discount_price_bdt, in_stock, category_slug, brand, image]
      properties:
        id: { type: string }
        name_bn: { type: string }
        name_en: { type: string }
        price_paisa: { type: integer, minimum: 0, description: Stored price in integer paisa. }
        discount_paisa: { type: integer, nullable: true, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        price_bdt: { type: number, minimum: 0 }
        sale_price_bdt: { type: number, minimum: 0, description: Effective selling price after a valid discount. }
        discount_price_bdt: { type: number, nullable: true, minimum: 0 }
        in_stock: { type: boolean }
        category_slug: { type: string }
        brand: { type: string, nullable: true }
        image: { type: string, nullable: true }
    CatalogProductDetail:
      type: object
      required: [id, name_bn, name_en, price_paisa, discount_paisa, stock, price_bdt, sale_price_bdt, discount_price_bdt, in_stock, category_slug, brand, seller_shop, variants, images, rating, review_count]
      properties:
        id: { type: string }
        name_bn: { type: string }
        name_en: { type: string }
        price_paisa: { type: integer, minimum: 0 }
        discount_paisa: { type: integer, nullable: true, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        price_bdt: { type: number, minimum: 0 }
        sale_price_bdt: { type: number, minimum: 0 }
        discount_price_bdt: { type: number, nullable: true, minimum: 0 }
        in_stock: { type: boolean }
        category_slug: { type: string }
        brand: { type: string, nullable: true }
        seller_shop: { type: string }
        variants:
          type: array
          items: { type: object, additionalProperties: true }
        images:
          type: array
          items: { type: string }
        rating: { type: number, minimum: 0, maximum: 5 }
        review_count: { type: integer, minimum: 0 }
    ProductReview:
      type: object
      required: [rating, comment, created_at, name]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        name: { type: string }
    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        name: { type: string }
        phone: { type: string }
        address: { type: string }
        area: { type: string }
        is_default: { type: integer, enum: [0, 1] }
    AddressInput:
      type: object
      required: [phone, address, area]
      properties:
        label: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 100, description: Defaults to the account name when omitted. }
        phone: { type: string, description: Bangladeshi mobile number normalized before storage. }
        address: { type: string, maxLength: 500 }
        area: { type: string, maxLength: 100 }
        is_default: { type: boolean }
    WishlistProduct:
      type: object
      properties:
        id: { type: string }
        name_bn: { type: string }
        name_en: { type: string }
        price_paisa: { type: integer }
        price_bdt: { type: number }
        discount_paisa: { type: integer, nullable: true }
        sale_price_bdt: { type: number }
        stock: { type: integer }
        in_stock: { type: boolean }
    AdminCoupon:
      type: object
      properties:
        code: { type: string }
        type: { type: string, enum: [FIXED, PERCENT] }
        value: { type: integer, description: Stored paisa for FIXED; whole percentage for PERCENT. }
        value_bdt: { type: number, nullable: true, description: FIXED value in BDT; null for PERCENT. }
        min_order_paisa: { type: integer }
        min_order_bdt: { type: number }
        max_uses: { type: integer, nullable: true }
        used_count: { type: integer }
        expires_at: { type: string, nullable: true }
        active: { type: integer, enum: [0, 1] }
    AdminCouponCreate:
      type: object
      additionalProperties: false
      required: [code, type, value]
      properties:
        code:
          type: string
          description: 1 to 30 ASCII letters/digits/underscores/hyphens after trimming; stored uppercase.
        type: { type: string, enum: [FIXED, PERCENT] }
        value:
          description: FIXED input is positive BDT with at most two decimal places. PERCENT input is a whole number from 1 to 90. Prefer decimal strings for exact BDT inputs.
          oneOf:
            - type: number
              minimum: 0
              exclusiveMinimum: true
            - type: string
              pattern: '^\d+(?:\.\d{1,2})?$'
        min_order_bdt:
          description: Nonnegative BDT with at most two decimals; omitted or empty string means zero.
          oneOf:
            - type: number
              minimum: 0
            - type: string
              pattern: '^(?:\d+(?:\.\d{1,2})?)?$'
        max_uses:
          description: Positive safe integer; omitted/null/empty string means unlimited global uses.
          oneOf:
            - type: integer
              minimum: 1
              nullable: true
            - type: string
              pattern: '^\d*$'
        expires_at:
          type: string
          nullable: true
          description: Future timezone-qualified ISO timestamp or legacy date at midnight UTC. Omitted/null/empty string means no expiry. Stored as canonical UTC ISO.
        active: { type: boolean, default: true }
    CustomerCart:
      type: object
      required: [items, subtotal_bdt, item_count]
      properties:
        subtotal_bdt: { type: number, description: Integer-paisa sum converted once to BDT. }
        item_count: { type: integer, minimum: 0, description: Sum of quantities rather than number of product lines. }
        items:
          type: array
          items:
            type: object
            required: [product_id, name_bn, name_en, quantity, stock, image, unit_price_bdt, line_total_bdt, available]
            properties:
              product_id: { type: string }
              name_bn: { type: string }
              name_en: { type: string }
              quantity: { type: integer, minimum: 1 }
              stock: { type: integer, minimum: 0 }
              image: { type: string, nullable: true }
              unit_price_bdt: { type: number }
              line_total_bdt: { type: number }
              available: { type: boolean }
    Shipment:
      type: object
      required: [provider, tracking_id, status, mode]
      properties:
        provider: { type: string }
        tracking_id: { type: string }
        status: { type: string }
        mode: { type: string, description: Stored provider mode; sandbox is not live fulfilment. }
    CustomerOrder:
      type: object
      required: [id, orderNumber, status, total_bdt, subtotal_bdt, shipping_bdt, discount_bdt, payment, delivery, items, suborders]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        status: { type: string }
        total_bdt: { type: number, description: BDT converted from integer paisa. }
        subtotal_bdt: { type: number }
        shipping_bdt: { type: number }
        discount_bdt: { type: number }
        coupon_code: { type: string, nullable: true }
        created_at: { type: string }
        payment:
          type: object
          properties:
            method: { type: string }
            status: { type: string }
        delivery:
          type: object
          properties:
            name: { type: string }
            phone: { type: string }
            address: { type: string }
            area: { type: string }
            note: { type: string, description: The customer's own delivery note. }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string }
              name_bn: { type: string }
              quantity: { type: integer }
              unit_price_bdt: { type: number }
              variant: { type: string }
              seller_order_id: { type: string, nullable: true }
        suborders:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              shop: { type: string, nullable: true }
              status: { type: string }
              subtotal_bdt: { type: number }
              shipment:
                type: object
                nullable: true
                description: Latest stored shipment by created_at then ID, or null.
                allOf:
                  - $ref: '#/components/schemas/Shipment'
    CustomerTracking:
      type: object
      required: [orderNumber, status, events, shipments]
      properties:
        orderNumber: { type: string }
        status: { type: string }
        events:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              created_at: { type: string }
              seller_order_id: { type: string, nullable: true }
        shipments:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Shipment'
              - type: object
                properties:
                  seller_order_id: { type: string }

    SellerProductInput:
      type: object
      additionalProperties: false
      required: [name_bn, name_en, price_bdt, stock, category_slug]
      properties:
        name_bn: { type: string, minLength: 1, maxLength: 160 }
        name_en: { type: string, minLength: 1, maxLength: 160 }
        price_bdt: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
        discount_price_bdt: { type: number, nullable: true, exclusiveMinimum: 0 }
        stock: { type: integer, minimum: 0, maximum: 1000000 }
        category_slug: { type: string, minLength: 1 }
        brand_slug: { type: string, nullable: true }
        description: { type: string, maxLength: 5000 }
        sku: { type: string, maxLength: 40, nullable: true }
        images:
          type: array
          maxItems: 6
          items: { type: string, format: uri, pattern: '^https://' }
        variants:
          type: array
          maxItems: 30
          items:
            type: object
            required: [label]
            properties:
              label: { type: string, maxLength: 60 }
              sku: { type: string, maxLength: 40 }
    SellerProductPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name_bn: { type: string, minLength: 1, maxLength: 160 }
        name_en: { type: string, minLength: 1, maxLength: 160 }
        price_bdt: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
        discount_price_bdt: { type: number, nullable: true, exclusiveMinimum: 0 }
        stock: { type: integer, minimum: 0, maximum: 1000000 }
        category_slug: { type: string, minLength: 1 }
        brand_slug: { type: string, nullable: true }
        description: { type: string, maxLength: 5000 }
        sku: { type: string, maxLength: 40, nullable: true }
        images:
          type: array
          maxItems: 6
          items: { type: string, format: uri, pattern: '^https://' }
        variants:
          type: array
          maxItems: 30
          items: { type: object, additionalProperties: true }
    SellerPayoutRequest:
      type: object
      additionalProperties: false
      required: [amount_bdt, method, account]
      properties:
        amount_bdt: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
        method: { type: string, enum: [BKASH, NAGAD, ROCKET, BANK] }
        account: { type: string, minLength: 1, maxLength: 100 }
    AdminOrderNoteInput:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, maxLength: 1000 }
    AdminShippingInput:
      type: object
      additionalProperties: false
      required: [shipping_bdt]
      properties:
        shipping_bdt: { type: number, minimum: 0, maximum: 100000 }
