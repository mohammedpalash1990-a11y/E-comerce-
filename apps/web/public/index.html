<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAAT — বাংলাদেশের মার্কেটপ্লেস</title><style>
:root{--ink:#17191c;--gold:#c8a96a;--paper:#f7f4ed}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}header{background:var(--ink);color:white;padding:18px max(18px,calc((100% - 1100px)/2));display:flex;gap:18px;align-items:center;flex-wrap:wrap}.brand{font: bold 28px Georgia;color:var(--gold);letter-spacing:2px}input,button{padding:12px;border:1px solid #ddd;border-radius:8px;font:inherit}.search{flex:1;display:flex}.search input{flex:1}.btn{background:var(--gold);border:0;font-weight:700;cursor:pointer}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.hero{padding:42px;border-radius:18px;background:linear-gradient(110deg,#22272c,#555044);color:#fff}.hero h1{font:42px Georgia;color:#f5e7c8}.chips,.grid{display:flex;gap:12px;flex-wrap:wrap}.chips{margin:20px 0}.card{background:white;border:1px solid #e8e2d7;border-radius:14px;padding:18px;flex:1 1 220px}.price{font-weight:bold;font-size:20px;margin:12px 0}.panel{background:white;border-radius:14px;padding:20px;margin-top:24px}.muted{color:#777;font-size:13px}a{color:inherit}@media(max-width:600px){.hero h1{font-size:30px}.hero{padding:25px}}
</style></head><body><header><div class="brand">HAAT.</div><div class="search"><input id="q" placeholder="পণ্য খুঁজুন"><button class="btn" id="search">খুঁজুন</button></div><a href="/seller.html">Seller</a><a href="/admin.html">Admin</a></header><main class="wrap"><section class="hero"><small>BANGLADESH MULTI-VENDOR MARKETPLACE</small><h1>পছন্দের সবকিছু,<br>এক ঠিকানায়।</h1><p>বাংলাদেশের জন্য বাংলা-প্রথম অনলাইন মার্কেটপ্লেস।</p></section><h2>ক্যাটাগরি</h2><div id="cats" class="chips"></div><h2>জনপ্রিয় পণ্য</h2><div id="products" class="grid"></div><section class="panel"><h2>ডেমো লগইন</h2><p>Customer: 01700000003 / Customer@12345</p><p class="muted">এই রিপোজিটরির MVP-তে COD checkout এবং development-only account seed রয়েছে।</p></section></main><script>
const api='/api/v1',money=n=>'৳'+Number(n).toLocaleString('en-BD',{maximumFractionDigits:2});let all=[],cat='';async function load(){const [c,p]=await Promise.all([fetch(api+'/categories').then(r=>r.json()),fetch(api+'/products').then(r=>r.json())]);all=p.data;document.querySelector('#cats').innerHTML='<button data-cat="">সব</button>'+c.data.map(x=>'<button data-cat="'+x.slug+'">'+x.name_bn+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});render()}function render(){const q=document.querySelector('#q').value.toLowerCase();const items=all.filter(p=>(!cat||p.category_slug===cat)&&(!q||p.name_bn.toLowerCase().includes(q)||p.name_en.toLowerCase().includes(q)));document.querySelector('#products').innerHTML=items.map(p=>'<article class="card"><h3>'+p.name_bn+'</h3><p class="muted">'+p.name_en+'</p><div class="price">'+money(p.price_bdt)+'</div><p>স্টক: '+p.stock+'</p></article>').join('')||'<p>পণ্য পাওয়া যায়নি</p>'}document.querySelector('#search').onclick=render;document.querySelector('#q').oninput=render;load().catch(e=>document.querySelector('#products').textContent='API সংযোগ হয়নি: '+e.message);
</script></body></html>
